<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products - NovaEdge E-Commerce Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-grid">
      <div class="brand">
        <a href="index.html">NovaEdge</a>
      </div>
      <nav class="nav-links">
        <a href="index.html#products">Home</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="cart-toggle" id="cartToggle" aria-label="Open cart">
        Cart <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="section" id="products">
      <div class="container section-header">
        <div>
          <p class="eyebrow">All products</p>
          <h2>Browse our complete catalog</h2>
        </div>
        <div class="search-filter-group">
            <div class="search-controls">
              <input id="productSearch" type="search" placeholder="Search products, categories, or features" aria-label="Search products" />
              <button type="button" id="productSearchBtn" class="icon-btn" aria-label="Search">
                <!-- tiny microscope icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button type="button" class="button button-secondary" id="clearSearch">Clear</button>
            </div>
            <div id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions"></div>
            <div class="filters" id="categoryFilters">
            <button class="filter active" data-category="all">All</button>
            <button class="filter" data-category="design">Design</button>
            <button class="filter" data-category="branding">Branding</button>
            <button class="filter" data-category="strategy">Strategy</button>
          </div>
        </div>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </section>
  </main>

  <aside class="cart-panel" id="cartPanel" aria-hidden="true">
    <div class="cart-header">
      <h2>Your cart</h2>
      <button id="closeCart" aria-label="Close cart">×</button>
    </div>
    <div class="cart-content" id="cartContent">
      <p class="empty-cart">Your cart is empty. Add products to get started.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-summary">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>
      <button class="button button-primary" id="checkoutButton">Checkout</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>© 2026 NovaEdge. Designed for modern e-commerce businesses.</p>
      <nav class="footer-links">
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </footer>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="products-page.js"></script>
</body>
</html>
